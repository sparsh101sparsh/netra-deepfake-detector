<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152b" />
      <stop offset="50%" stop-color="#030914" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <linearGradient id="logoCyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="logoIrisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#logoBgGrad)" stroke="url(#logoCyberBorder)" stroke-width="4" />

  <!-- Crisp Bold Eye Contour -->
  <path d="M 20 64 C 36 36, 92 36, 108 64 C 92 92, 36 92, 20 64 Z" fill="#040d1c" stroke="url(#logoCyberBorder)" stroke-width="6.5" stroke-linejoin="round" />

  <!-- Outer Iris Ring -->
  <circle cx="64" cy="64" r="19" fill="url(#logoIrisGrad)" />

  <!-- Inner Pupil Cavity -->
  <circle cx="64" cy="64" r="11" fill="#02050e" />

  <!-- Luminous Pupil Core -->
  <circle cx="64" cy="64" r="5.5" fill="#00f0ff" />
  <circle cx="68" cy="60" r="3" fill="#ffffff" />
</svg>
