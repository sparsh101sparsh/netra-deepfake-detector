<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <!-- NETRA Truth Mark — Transparent Vector Icon -->
  <defs>
    <!-- Center Radial Glow Halo -->
    <radialGradient id="transCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Glow Filter -->
    <filter id="transVectorBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Center Ambient Halo Glow -->
  <circle cx="200" cy="200" r="95" fill="url(#transCenterGlow)" />

  <!-- Main Emblem Rig with Specular Bloom -->
  <g filter="url(#transVectorBloom)">
    <!-- 1. Outer Bold Kite / Diamond Perimeter -->
    <polygon
      points="200,62 332,200 200,338 68,200"
      stroke="#ffffff"
      stroke-width="5.5"
      stroke-linejoin="miter"
      stroke-miterlimit="10"
      stroke-linecap="square"
    />

    <!-- 2. Inner Concentric Diamond -->
    <polygon
      points="200,126 256,200 200,274 144,200"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linejoin="miter"
      stroke-miterlimit="10"
      stroke-linecap="square"
    />

    <!-- 3. Facet Connector Lines -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="miter">
      <!-- From Outer Top (200, 62) to Inner Left & Right -->
      <line x1="200" y1="62" x2="144" y2="200" />
      <line x1="200" y1="62" x2="256" y2="200" />

      <!-- From Outer Bottom (200, 338) to Inner Left & Right -->
      <line x1="200" y1="338" x2="144" y2="200" />
      <line x1="200" y1="338" x2="256" y2="200" />

      <!-- From Outer Left (68, 200) to Inner Top & Bottom -->
      <line x1="68" y1="200" x2="200" y2="126" />
      <line x1="68" y1="200" x2="200" y2="274" />

      <!-- From Outer Right (332, 200) to Inner Top & Bottom -->
      <line x1="332" y1="200" x2="200" y2="126" />
      <line x1="332" y1="200" x2="200" y2="274" />
    </g>

    <!-- 4. Horizontal Telemetry Axis (Left to Right) -->
    <line
      x1="68"
      y1="200"
      x2="332"
      y2="200"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linecap="round"
    />

    <!-- 5. Central Opaque Aperture Dot Core -->
    <circle
      cx="200"
      cy="200"
      r="22"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="1"
    />
  </g>
</svg>
