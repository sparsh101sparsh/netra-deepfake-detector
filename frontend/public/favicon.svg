<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="50%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <radialGradient id="favAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#favBg)" />
    <circle cx="256" cy="256" r="180" fill="url(#favAmberGlow)" />

    <!-- Ambient Grid Lines -->
    <g stroke="#f59e0b" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="6 8">
      <circle cx="256" cy="256" r="184" />
      <line x1="256" y1="20" x2="256" y2="492" />
      <line x1="20" y1="256" x2="492" y2="256" />
    </g>

    <!-- ── TRUTH MARK KITE EMBLEM ── -->
    <g transform="translate(256, 256) scale(2.6) translate(-100, -100)" filter="url(#vectorGlow)">
      <!-- 1. Outer Kite Diamond -->
      <polygon
        points="100,56 148,100 100,144 52,100"
        stroke="#f59e0b"
        stroke-width="5"
        stroke-linejoin="miter"
      />

      <!-- 2. Inner Concentric Diamond -->
      <polygon
        points="100,74 122,100 100,126 78,100"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linejoin="miter"
      />

      <!-- 3. Facet Connector Rays -->
      <g stroke="#fcd34d" stroke-width="2" stroke-linecap="round">
        <line x1="100" y1="56" x2="78" y2="100" />
        <line x1="100" y1="56" x2="122" y2="100" />
        <line x1="100" y1="144" x2="78" y2="100" />
        <line x1="100" y1="144" x2="122" y2="100" />
        <line x1="52" y1="100" x2="100" y2="74" />
        <line x1="52" y1="100" x2="100" y2="126" />
        <line x1="148" y1="100" x2="100" y2="74" />
        <line x1="148" y1="100" x2="100" y2="126" />
      </g>

      <!-- 4. Horizontal Telemetry Axis -->
      <line x1="52" y1="100" x2="148" y2="100" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />

      <!-- 5. Central Ocular Core Dot -->
      <circle cx="100" cy="100" r="9" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
    </g>

    <!-- Outer Squircle Ring Border -->
    <rect x="3" y="3" width="506" height="506" rx="112" ry="112" fill="none" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.75" />
  </g>
</svg>