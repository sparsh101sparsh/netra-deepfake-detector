<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <!-- NETRA Truth Mark Kite / Diamond Emblem - Crisp Pure White Favicon -->
  <defs>
    <!-- Center Radial Glow Halo -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Glow Filter -->
    <filter id="vectorBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="favSquircle">
      <rect x="0" y="0" width="400" height="400" rx="90" ry="90" />
    </clipPath>
  </defs>

  <g clip-path="url(#favSquircle)">
    <!-- Deep Obsidian Dark Surface -->
    <rect width="400" height="400" fill="#030712" />

    <!-- Coordinate Dot Matrix Grid -->
    <g fill="#ffffff" opacity="0.22">
      <circle cx="35" cy="75" r="2.4" />
      <circle cx="100" cy="75" r="2.4" />
      <circle cx="165" cy="75" r="2.4" />
      <circle cx="235" cy="75" r="2.4" />
      <circle cx="300" cy="75" r="2.4" />
      <circle cx="365" cy="75" r="2.4" />

      <circle cx="35" cy="155" r="2.4" />
      <circle cx="100" cy="155" r="2.4" />
      <circle cx="300" cy="155" r="2.4" />
      <circle cx="365" cy="155" r="2.4" />

      <circle cx="35" cy="245" r="2.4" />
      <circle cx="100" cy="245" r="2.4" />
      <circle cx="300" cy="245" r="2.4" />
      <circle cx="365" cy="245" r="2.4" />

      <circle cx="35" cy="325" r="2.4" />
      <circle cx="100" cy="325" r="2.4" />
      <circle cx="165" cy="325" r="2.4" />
      <circle cx="235" cy="325" r="2.4" />
      <circle cx="300" cy="325" r="2.4" />
      <circle cx="365" cy="325" r="2.4" />
    </g>

    <!-- Center Ambient Halo Glow -->
    <circle cx="200" cy="200" r="100" fill="url(#centerGlow)" />

    <!-- Main Emblem Rig with Specular Bloom -->
    <g filter="url(#vectorBloom)">
      <!-- Outer Bold Kite / Diamond Perimeter -->
      <polygon
        points="200,62 332,200 200,338 68,200"
        stroke="#ffffff"
        stroke-width="7"
        stroke-linejoin="miter"
        stroke-miterlimit="10"
      />

      <!-- Inner Concentric Diamond -->
      <polygon
        points="200,126 256,200 200,274 144,200"
        stroke="#ffffff"
        stroke-width="4.5"
        stroke-linejoin="miter"
        stroke-miterlimit="10"
      />

      <!-- Facet Connector Lines -->
      <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="miter">
        <line x1="200" y1="62" x2="144" y2="200" />
        <line x1="200" y1="62" x2="256" y2="200" />
        <line x1="200" y1="338" x2="144" y2="200" />
        <line x1="200" y1="338" x2="256" y2="200" />
        <line x1="68" y1="200" x2="200" y2="126" />
        <line x1="68" y1="200" x2="200" y2="274" />
        <line x1="332" y1="200" x2="200" y2="126" />
        <line x1="332" y1="200" x2="200" y2="274" />
      </g>

      <!-- Horizontal Telemetry Axis -->
      <line
        x1="68"
        y1="200"
        x2="332"
        y2="200"
        stroke="#ffffff"
        stroke-width="4.5"
        stroke-linecap="round"
      />

      <!-- Central Opaque Aperture Dot Core -->
      <circle cx="200" cy="200" r="22" fill="#ffffff" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Outer Squircle Ring Border -->
    <rect x="3" y="3" width="394" height="394" rx="87" ry="87" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />
  </g>
</svg>
