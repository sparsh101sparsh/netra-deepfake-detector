<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dark Obsidian Canvas Gradient -->
    <radialGradient id="favBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0F1E36" />
      <stop offset="50%" stop-color="#081224" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Amber / Gold Telemetry Glow -->
    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <filter id="favBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="squircleClip">
      <rect x="8" y="8" width="240" height="240" rx="54" ry="54" />
    </clipPath>
  </defs>

  <!-- Squircle App Badge Body -->
  <g clip-path="url(#squircleClip)">
    <rect x="8" y="8" width="240" height="240" fill="url(#favBg)" />
    <circle cx="128" cy="128" r="90" fill="url(#favGlow)" />

    <!-- Technical Crosshair Coordinate Grid Lines -->
    <g stroke="#f59e0b" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 5">
      <circle cx="128" cy="128" r="92" />
      <line x1="128" y1="16" x2="128" y2="240" />
      <line x1="16" y1="128" x2="240" y2="128" />
    </g>

    <!-- ── NETRA TRUTH MARK EMBLEM ── -->
    <g filter="url(#favBloom)">
      <!-- 1. Outer Diamond (Gold/Amber) -->
      <polygon
        points="128,38 214,128 128,218 42,128"
        stroke="#f59e0b"
        stroke-width="7"
        stroke-linejoin="miter"
        stroke-miterlimit="10"
      />

      <!-- 2. Inner Concentric Diamond (Diamond White) -->
      <polygon
        points="128,80 166,128 128,176 90,128"
        stroke="#ffffff"
        stroke-width="4.5"
        stroke-linejoin="miter"
        stroke-miterlimit="10"
      />

      <!-- 3. Facet Connector Rays -->
      <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
        <line x1="128" y1="38" x2="90" y2="128" />
        <line x1="128" y1="38" x2="166" y2="128" />
        <line x1="128" y1="218" x2="90" y2="128" />
        <line x1="128" y1="218" x2="166" y2="128" />
        <line x1="42" y1="128" x2="128" y2="80" />
        <line x1="42" y1="128" x2="128" y2="176" />
        <line x1="214" y1="128" x2="128" y2="80" />
        <line x1="214" y1="128" x2="128" y2="176" />
      </g>

      <!-- 4. Horizontal Telemetry Radar Axis -->
      <line x1="38" y1="128" x2="218" y2="128" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" />

      <!-- 5. Central Ocular Aperture Core -->
      <circle cx="128" cy="128" r="16" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" />
      <circle cx="128" cy="128" r="7" fill="#030712" />
    </g>
  </g>

  <!-- Outer Squircle Ring Border -->
  <rect x="8" y="8" width="240" height="240" rx="54" ry="54" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-opacity="0.6" />
</svg>