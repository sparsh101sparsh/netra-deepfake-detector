version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: netra-n8n-orchestrator
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - NETRA_API_URL=https://netra-api-pmr7.onrender.com
      - BOT_SECRET_KEY=netra_bot_secret_2026
      # Meta WhatsApp Cloud API Direct Native Configuration
      - META_WHATSAPP_PHONE_NUMBER_ID=1329851416876776
      - META_WHATSAPP_ACCESS_TOKEN=EAAG_META_WHATSAPP_ACCESS_TOKEN_PLACEHOLDER
      - META_WHATSAPP_VERIFY_TOKEN=netra_whatsapp_verify_token_2026
      - WHATSAPP_BROADCAST_RECIPIENT=919876543210
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    driver: local